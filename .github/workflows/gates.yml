name: gates

# Every pull request and every push to main meets the same gates a commit meets on a seat
# (bin/gates/run-gates.sh): secrets, personal data, identity and the vault. A refusal fails the run.
#
# The operator's deny list stays in his home, as in Ymir, and is never sent here. A runner has no home, so this run
# judges SHAPES: keys and tokens, private addresses, personal mailboxes, a real tailnet host. His own words are
# judged on his seats, by the same wards in the local hooks, reading the list from the home.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # the whole history: gitleaks judges every commit, not only the last

      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -sSL -o "$tmp/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/gitleaks.tar.gz" -C "$tmp" gitleaks
          install -m 0755 "$tmp/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: The borrowed gates match Ymir's
        run: bash bin/gates/vendor-sync.sh --check

      - name: Every gate refuses its planted fault
        run: bash tests/gates.test.sh

      - name: The tree and its whole history
        run: bash bin/gates/run-gates.sh tree

      - name: What this pull request adds (its files, and its commits' author and committer)
        if: github.event_name == 'pull_request'
        run: bash bin/gates/run-gates.sh range "origin/${{ github.base_ref }}" HEAD

      - name: The pull request's own title and body
        if: github.event_name == 'pull_request'
        run: bash bin/gates/guards/pr-identity-guard.sh --ci
